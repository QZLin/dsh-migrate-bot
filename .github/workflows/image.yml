# Build the Action's image when its contents or publishing configuration changes.
# The CLI smoke check runs in the build; this workflow never publishes an image.
name: image

on:
  pull_request:
    paths:
      - Dockerfile
      - container/**
      - src/**
      - tsconfig.json
      - package.json
      - pnpm-lock.yaml
      - action.yml
      - .github/workflows/image.yml
      - .github/workflows/release.yml
  push:
    branches: [main]
    paths:
      - Dockerfile
      - container/**
      - src/**
      - tsconfig.json
      - package.json
      - pnpm-lock.yaml
      - action.yml
      - .github/workflows/image.yml
      - .github/workflows/release.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=raw,value=ci-${{ github.sha }}
          flavor: latest=false
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
