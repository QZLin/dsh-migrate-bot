# Run this repository's own Action the way a consumer does: `uses: ./` builds the
# composite Action on a plain runner, with no container runtime and no published
# image. It is the only check that exercises `action.yml` itself.
name: selftest

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  composite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The fixture keeps its own test command, so this proves the Action's
      # inputs, outputs and mechanical check on a runner without a container.
      - id: check
        uses: ./
        with:
          command: check
          workdir: fixtures/plugins/typecheck-ok
          config: ../../../.github/dsh-migrate.selftest.yml
      - name: The Action reports its outputs
        run: |
          set -euo pipefail
          test "${{ steps.check.outputs.status }}" = "compatible"
          test -n "${{ steps.check.outputs.target_tag }}"
          echo "status: ${{ steps.check.outputs.status }}"
          echo "target: ${{ steps.check.outputs.target_tag }}"
