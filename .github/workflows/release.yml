# A pushed vX.Y.Z tag publishes a GitHub Release and moves the major tag (v1,
# v2, …) consumers pin. The Action is a composite Action built from the tag's
# own sources, so there is no image to publish first.

name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: The vX.Y.Z tag the major tag should point to
        required: true
        type: string

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TAG }}
      - name: Move the major tag
        if: ${{ !contains(env.TAG, '-') }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "expected vMAJOR.MINOR.PATCH, got $TAG"
            exit 1
          fi
          major="${TAG%%.*}"
          git tag -f "$major" "$TAG"
          git push origin "refs/tags/$major" --force
          echo "pointed $major at $TAG"
      - name: Publish the GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          prerelease: ${{ contains(env.TAG, '-') }}
          generate_release_notes: true
