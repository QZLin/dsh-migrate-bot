# Copy to .github/workflows/dsh-migrate.yml in the plugin repository, set the
# cron, and pin the release: `@v2` exists once 2.0.0 is released, and a release
# candidate is pinned by its tag (docs/operations/release.md). The job lives in
# the reusable workflow this calls; this file only chooses the triggers.
# docs/operations/install.md explains every part.

name: dsh-migrate

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      dsh_release:
        description: dsh release to bump the plugins to, such as 0.2.1-rc.2 (empty = the target in .github/dsh-migrate.yml, by default the newest dsh release)
        required: false
        type: string
      bump_again:
        description: Bump again to a dsh release this repository was already bumped to, which is skipped otherwise (never while that release's proposal pull request is open)
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  dsh-migrate:
    uses: QZLin/dsh-migrate-bot/.github/workflows/migrate.yml@v2
    with:
      target: ${{ inputs.dsh_release || '' }}
      force: ${{ inputs.bump_again || false }}
    secrets: inherit
