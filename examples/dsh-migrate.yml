# Copy to .github/dsh-migrate.yml in the plugin repository. Every key is
# optional; docs/reference/configuration.md lists them all with their defaults.
# The schedule lives in the workflow file: GitHub only honors on.schedule there.

target: latest

bump:
  # Raise each plugin's own `version` by a patch during the dependency update.
  ownVersion: true

# Replaces (does not extend) the built-in mechanical checks.
# tests:
#   commands:
#     - npm test
#     - npm run typecheck

# The boot check starts the bumped plugin on the target release; the web check
# loads it in the web composition. Both install the release from npm.
# checks:
#   boot:
#     enabled: true
#     timeoutMs: 180000
#   web:
#     enabled: true
#     timeoutMs: 120000

# timeouts:
#   commandMs: 1200000
