name: DSH Plugin Bump Bot
description: Raise a DeepSeek Harness plugin to a new dsh-v* release, run its checks, and propose the result. No model is consulted.
author: royenheart
branding:
  icon: refresh-cw
  color: blue
inputs:
  command:
    description: bump, check, status, or print-config
    required: false
    default: bump
  workdir:
    description: The plugin checkout, relative to the workspace
    required: false
    default: '.'
  config:
    description: The configuration file, relative to the plugin checkout
    required: false
    default: .github/dsh-migrate.yml
  target:
    description: "The dsh release to bump the plugins to: latest, a version such as 0.2.1-rc.2, or a dsh-v* tag; empty uses the target in the configuration"
    required: false
    default: ''
  force:
    description: bump only. Bump again to a dsh release this repository was already bumped to, which is skipped otherwise; never while that release's proposal pull request is open
    required: false
    default: 'false'
  skip_github:
    description: bump only. Do not publish a proposal
    required: false
    default: 'false'
outputs:
  status:
    description: compatible, proposed, unpublished, failed, error, skipped, or the state an event left the migration in
    value: ${{ steps.run.outputs.status }}
  target_tag:
    description: The target release tag
    value: ${{ steps.run.outputs.target_tag }}
  verified_tag:
    description: The newest verified release tag
    value: ${{ steps.run.outputs.verified_tag }}
  badge_message:
    description: The badge message on the state branch
    value: ${{ steps.run.outputs.badge_message }}
  pull_request_url:
    description: The proposal pull request, when there is one
    value: ${{ steps.run.outputs.pull_request_url }}
runs:
  using: composite
  steps:
    # The Action compiles its own TypeScript on the runner, so no image has to be
    # published and no container runtime is needed. Development dependencies are
    # installed because the build type-checks the tests and the gates too.
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    # The pnpm version has one source: packageManager in this Action's manifest,
    # which `pnpm/action-setup` cannot read for a path outside the workspace.
    - id: pnpm
      shell: bash
      run: echo "version=$(node -p "require(process.env.GITHUB_ACTION_PATH + '/package.json').packageManager.replace(/^pnpm@/, '')")" >> "$GITHUB_OUTPUT"
    - uses: pnpm/action-setup@v4
      with:
        version: ${{ steps.pnpm.outputs.version }}
    - shell: bash
      working-directory: ${{ github.action_path }}
      run: pnpm install --frozen-lockfile
    - shell: bash
      working-directory: ${{ github.action_path }}
      run: pnpm run build
    - id: run
      shell: bash
      env:
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_WORKDIR: ${{ inputs.workdir }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_TARGET: ${{ inputs.target }}
        INPUT_FORCE: ${{ inputs.force }}
        INPUT_SKIP_GITHUB: ${{ inputs.skip_github }}
      run: bash "$GITHUB_ACTION_PATH/action/entrypoint.sh"
